name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: kakeibo-api
  ECS_CLUSTER: kakeibo
  ECS_SERVICE: kakeibo-api-service
  ECS_TASK_FAMILY: kakeibo-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::554443241135:role/kakeibo-gha-backend
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./backend
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
              --output text)
            echo "[$i/60] rolloutState=$STATE"
            if [ "$STATE" = "COMPLETED" ]; then
              echo "Deployment succeeded"
              exit 0
            fi
            if [ "$STATE" = "FAILED" ]; then
              echo "Deployment failed"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout waiting for deployment"
          exit 1
